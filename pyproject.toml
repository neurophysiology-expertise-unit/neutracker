[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutracker"
version = "0.2.0"
description = "Mouse pupil tracker GUI and tools"
readme = "README.md"
authors = [
  { name = "Cagatay Aydin", email = "cagjony@gmail.com" }
]
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "opencv-python-headless", # Use headless for library, GUI for apps (handled by conda)
    "h5py",
    "pims",
    "tifffile",
    "natsort",
    "decord",
    "PyQt5",
    "pyqtgraph",
    "imageio",
    "slicerator",
    "pillow",
]

[project.scripts]
neutracker-gui = "neutracker.gui:main"
neutracker-cli = "neutracker.cli:main"
neutracker     = "neutracker.cli:main"
